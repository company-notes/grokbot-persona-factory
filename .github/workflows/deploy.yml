name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: persona-forge-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    # Pin the runner image to avoid automatic Ubuntu 26 migration notices.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          package-manager-cache: false
      - name: Verify patched Node.js runtime
        run: |
          node --version
          node -e 'const v=process.versions.node.split(".").map(Number); if(v[0] !== 26 || v[1] < 12 || (v[1] === 12 && v[2] < 1)) {throw new Error("Node.js must be v26.12.1 or later in the v26 security release line");}'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run API tests
        run: npm test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Browser end-to-end test
        run: python tests/BrowserTest.py
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
