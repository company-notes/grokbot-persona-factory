name: HR Admin Persona API Demo
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional https://your-worker.workers.dev override'
        required: false
        type: string
jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate via live Persona Forge API
        env:
          PERSONA_BASE_URL: ${{ inputs.api_base_url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/demo_live_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Angela-Su-PersonaForge-API-Result
          path: api-demo-output/
          if-no-files-found: warn
